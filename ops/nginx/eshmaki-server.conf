# Onyx public delivery policy. Included from the eshmaki.me HTTPS server block.
# Keep this source-controlled include small: executable/style CSP needs a
# generated hash/report-only rollout because the landing pages intentionally
# inline their critical CSS and module script. Framing policy is independent of
# those hashes and must be response-delivered because browsers ignore
# frame-ancestors in a meta CSP.

# nginx 1.29.3+ can merge these server headers into locations that define their
# own Cache-Control or X-Robots-Tag headers instead of dropping inheritance.
add_header_inherit merge;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;

# Serve the established OnyxOS public site under its canonical lowercase URL.
# Its source assets intentionally retain their historic /onyxOS/ prefix.
location = /onyxos {
    return 308 /onyxos/;
}

location ^~ /onyxos/ {
    alias /home/kain/onyx/out/onyxOS/;
    try_files $uri $uri/ /onyxOS/index.html =404;
    add_header Cache-Control "no-cache";
}

# Vite fingerprints every application asset. Keep missing chunk URLs from
# falling through to an HTML document, and let released chunks live forever in
# browser caches: a new deploy always writes a new filename.
location ^~ /assets/ {
    root /home/kain/onyx/out;
    try_files $uri =404;
    error_page 404 = @onyx_public_asset_not_found;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Stable-name public artwork, install media, and standalone fonts can change at
# the same URL, so recheck daily. Fingerprinted /assets/ files never reach this
# regex because their ^~ prefix above wins first.
location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
    add_header Cache-Control "public, max-age=86400";
}

# Stats uses the same Onyx Vite export as the rest of the public site. This
# longer prefix must win over the /stats/ SPA fallback so a stale or mistyped
# chunk is a real 404, not a 200 text/html response that the browser rejects as
# JavaScript. A plain alias handler naturally returns 404 for missing files;
# avoid alias+try_files URI rewriting here.
location ^~ /stats/assets/ {
    alias /home/kain/onyx/out/assets/;
    error_page 404 = @onyx_public_asset_not_found;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Never let a speculative or future fingerprint become a year-long negative
# cache entry just because the enclosing asset location is immutable.
location @onyx_public_asset_not_found {
    return 404;
}

# Canonical /stats path (trailing slash) for the public stats shell.
location = /stats {
    return 301 /stats/;
}

# Live chanstats JSON from Onyx Server (channel_dir in onyx-server.local.toml).
# Longer than the /stats/ SPA shell below so /stats/data/* never falls through
# to HTML. Must track the daemon write path after the Orochi→Onyx rename
# (/home/kain/onyx-server-run/chanstats — not the retired orochi-run tree).
location ^~ /stats/data/ {
    alias /home/kain/onyx-server-run/chanstats/;
    default_type application/json;
    try_files $uri =404;
    expires 30s;
    add_header Cache-Control "public, no-transform";
}

# Only the canonical stats shell may serve HTML. Data and assets have more
# specific locations above; unknown descendants must fail closed rather than
# returning a soft-404 document.
location = /stats/ {
    root /home/kain/onyx/out;
    try_files /stats/index.html =404;
    add_header Cache-Control "no-cache";
}

location ^~ /stats/ {
    return 404;
}

# Public, bounded backup-readiness manifest consumed by the Onyx status page.
# Exact-match precedence keeps the stats SPA fallback from returning HTML at a
# JSON URL. The page parser bounds and omits the manifest's local source paths.
location = /stats/backups/latest.json {
    alias /home/kain/onyx-server-run/backups/latest.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}

# Branded unknown-route document. `internal` prevents direct browsing from
# turning /404.html into an indexable success response; the parent location's
# error_page preserves the original 404 status.
location = /404.html {
    internal;
    root /home/kain/onyx/out;
    try_files /404.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# This regex is intentionally declared in the early source-controlled include.
# nginx evaluates regex locations in declaration order, and the enclosing
# server has a later generic .html cache rule. Owning HTML here ensures an
# unknown /name.html receives the same real-status branded 404 as extensionless
# public paths instead of falling through to that outer regex.
location ~* \.html$ {
    root /home/kain/onyx/out;
    try_files $uri =404;
    error_page 404 /404.html;
    add_header Cache-Control "no-cache";
}

# Onyx and the overlaid public site publish immutable fingerprints separately;
# every document, service worker, and manifest that reaches this fallback must
# revalidate once, without `expires` synthesising a duplicate Cache-Control.
location / {
    try_files $uri $uri/ $uri/index.html =404;
    error_page 404 /404.html;
    add_header Cache-Control "no-cache";
}
