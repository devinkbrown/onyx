# Onyx public delivery policy. Included from the eshmaki.me HTTPS server block.
# Keep this source-controlled include small: executable/style CSP needs a
# generated hash/report-only rollout because the landing pages intentionally
# inline their critical CSS and module script. Framing policy is independent of
# those hashes and must be response-delivered because browsers ignore
# frame-ancestors in a meta CSP.

# nginx 1.29.3+ can merge these server headers into locations that define their
# own Cache-Control or X-Robots-Tag headers instead of dropping inheritance.
add_header_inherit merge;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;

# Vite fingerprints every application asset. Keep missing chunk URLs from
# falling through to an HTML document, and let released chunks live forever in
# browser caches: a new deploy always writes a new filename.
location ^~ /assets/ {
    root /home/kain/onyx/out;
    try_files $uri =404;
    error_page 404 = @onyx_public_asset_not_found;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Stable-name public artwork, install media, and standalone fonts can change at
# the same URL, so recheck daily. Fingerprinted /assets/ files never reach this
# regex because their ^~ prefix above wins first.
location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
    add_header Cache-Control "public, max-age=86400";
}

# The stats dashboard is a separate Vite export. This longer prefix must win
# over its /stats/ SPA fallback so a stale or mistyped chunk is a real 404, not
# a 200 text/html response that the browser then rejects as JavaScript. A plain
# alias handler naturally returns 404 for missing files; avoid alias+try_files
# URI rewriting here.
location ^~ /stats/assets/ {
    alias /home/kain/onyx-stats/out/assets/;
    error_page 404 = @onyx_public_asset_not_found;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Never let a speculative or future fingerprint become a year-long negative
# cache entry just because the enclosing asset location is immutable.
location @onyx_public_asset_not_found {
    return 404;
}

# The stats document is a client-routed app. Its longer data and asset prefixes
# above/below retain their own cache policies; only the HTML shell revalidates.
location ^~ /stats/ {
    alias /home/kain/onyx-stats/out/;
    try_files $uri $uri/ /stats/index.html;
    add_header Cache-Control "no-cache";
}

# Public, bounded backup-readiness manifest consumed by the Onyx status page.
# Exact-match precedence keeps the stats SPA fallback from returning HTML at a
# JSON URL. The page parser bounds and omits the manifest's local source paths.
location = /stats/backups/latest.json {
    alias /home/kain/onyx-server-run/backups/latest.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}

# Onyx and the overlaid public site publish immutable fingerprints separately;
# every document, service worker, and manifest that reaches this fallback must
# revalidate once, without `expires` synthesising a duplicate Cache-Control.
location / {
    try_files $uri $uri/ $uri/index.html =404;
    add_header Cache-Control "no-cache";
}
