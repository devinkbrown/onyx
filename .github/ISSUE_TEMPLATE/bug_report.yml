name: Bug report
description: Report a reproducible Onyx client defect without private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private keys, real message history, or
        exploit details. Use SECURITY.md for vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest sanitized sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Join ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or deployment
      description: Commit SHA, branch, or hosted URL/build stamp if known.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Text chat / IRC wire
        - Account / session / passkeys
        - Direct-message E2EE
        - Voice / video / media security
        - History / search / import
        - PWA / install / update
        - Responsive / accessibility
        - Public information route
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, viewport, server endpoint type, and relevant capabilities.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private keys, access tokens, and real user data.
          required: true
        - label: This is not a vulnerability report requiring private disclosure.
          required: true
