name: Elm client verification

on:
  pull_request:
    paths:
      - 'elm/**'
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vitest*.ts'
      - 'eslint.config.mjs'
      - 'playwright.config.ts'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - '.browserslistrc'
  push:
    paths:
      - 'elm/**'
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vitest*.ts'
      - 'eslint.config.mjs'
      - 'playwright.config.ts'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - '.browserslistrc'

permissions:
  contents: read

env:
  ELM_HOME: ${{ runner.temp }}/elm-home

jobs:
  elm-and-smoke:
    name: Elm 0.19.1 + deterministic Elm and JS lanes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked root tools
        run: pnpm install --frozen-lockfile
      - name: Cache exact Elm package sources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/elm-home
          key: elm-0.19.1-${{ hashFiles('elm/elm.json') }}
      - name: Install Elm compiler 0.19.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/elm-bin"
          curl --fail --location --retry 3 \
            https://github.com/elm/compiler/releases/download/0.19.1/binary-for-linux-64-bit.gz \
            --output "$RUNNER_TEMP/elm.gz"
          gunzip -c "$RUNNER_TEMP/elm.gz" > "$RUNNER_TEMP/elm-bin/elm"
          chmod 0755 "$RUNNER_TEMP/elm-bin/elm"
          test "$("$RUNNER_TEMP/elm-bin/elm" --version)" = 0.19.1
          echo "ELM_BIN=$RUNNER_TEMP/elm-bin/elm" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/elm-bin" >> "$GITHUB_PATH"
      - name: Install pinned elm-test via pnpm outside root dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/elm-test-tools"
          printf '{"private":true}\n' > "$RUNNER_TEMP/elm-test-tools/package.json"
          pnpm --dir "$RUNNER_TEMP/elm-test-tools" add --save-exact --ignore-scripts elm-test@0.19.1-revision17
          test "$("$RUNNER_TEMP/elm-test-tools/node_modules/.bin/elm-test" --version)" = 0.19.1-revision17
          echo "ELM_TEST_BIN=$RUNNER_TEMP/elm-test-tools/node_modules/.bin/elm-test" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/elm-test-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Vendor pinned Elm packages
        run: bash elm/tools/vendor-elm-packages.sh
      - name: Validate redacted transcript catalog
        run: node elm/tools/run-roadmap-checks.mjs validate-transcripts
      - name: Verify generated transcript fixture is current
        run: node elm/tools/generate-roadmap-fixtures.mjs --check
      - name: Compile and run focused transcript tests
        run: node elm/tools/run-roadmap-checks.mjs elm-focused
      - name: Compile and run the full Elm suite
        run: node elm/tools/run-roadmap-checks.mjs elm-full
      - name: Run all Elm browser-port smoke tests
        run: node elm/tools/run-roadmap-checks.mjs node-smokes
      - name: Demonstrate an expected assertion failure in a temporary copy
        run: node elm/tools/run-roadmap-checks.mjs expected-failure
      - name: Preserve actual client and server contract validator outcomes
        run: node elm/tools/run-roadmap-checks.mjs contract-observations
      - name: Write source manifest and tool provenance
        run: |
          node elm/tools/run-roadmap-checks.mjs manifest > "$RUNNER_TEMP/elm-source-manifest.json"
          node elm/tools/freeze-source-cut.mjs /tmp/onyx-elm-source-cut
      - name: Preserve lane receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elm-roadmap-receipts
          path: |
            /tmp/onyx-roadmap-receipts/*.json
            /tmp/onyx-elm-source-cut.json
            /tmp/onyx-elm-source-cut.tar.gz
          if-no-files-found: warn

  root-gates:
    name: Root typecheck, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run required root gates
        run: node elm/tools/run-roadmap-checks.mjs root-gates

  runtime-tests:
    name: Elm runtime Node, DOM, and isolated worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run isolated Elm runtime projects
        run: node elm/tools/run-roadmap-checks.mjs runtime-tests

  mock-chromium:
    name: Mock Chromium Elm journeys (dedicated lane)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Elm compiler 0.19.1 for site build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/elm-bin"
          curl --fail --location --retry 3 \
            https://github.com/elm/compiler/releases/download/0.19.1/binary-for-linux-64-bit.gz \
            --output "$RUNNER_TEMP/elm.gz"
          gunzip -c "$RUNNER_TEMP/elm.gz" > "$RUNNER_TEMP/elm-bin/elm"
          chmod 0755 "$RUNNER_TEMP/elm-bin/elm"
          test "$("$RUNNER_TEMP/elm-bin/elm" --version)" = 0.19.1
          echo "ELM_BIN=$RUNNER_TEMP/elm-bin/elm" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/elm-bin" >> "$GITHUB_PATH"
      - name: Cache exact Elm package sources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/elm-home
          key: elm-0.19.1-${{ hashFiles('elm/elm.json') }}
      - run: bash elm/tools/vendor-elm-packages.sh
      - run: pnpm exec playwright install --with-deps chromium
      - name: Select installed Chromium explicitly
        shell: bash
        run: echo "ONYX_CHROMIUM_EXECUTABLE=$(node -e 'const { chromium } = require("@playwright/test"); process.stdout.write(chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Prove declared Playwright suites are disjoint
        run: node elm/tools/run-roadmap-checks.mjs playwright-list-audit
      - name: Run mock Chromium journeys
        env:
          ROADMAP_BROWSER: Chromium mock
          ROADMAP_NETWORK: local mocked static server; no live Onyx Server
        run: node elm/tools/run-roadmap-checks.mjs chromium-mock
      - name: Preserve Chromium receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elm-mock-chromium-receipts
          path: /tmp/onyx-roadmap-receipts/*.json
          if-no-files-found: warn
