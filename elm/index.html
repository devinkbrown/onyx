<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4ec" data-site="#f7f4ec">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1518" data-site="#0e1518">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Onyx">
<meta name="format-detection" content="telephone=no">
<script>
/* Browser chrome tint. Public pages follow the visitor's light/dark
   preference (the media-scoped theme-color pair above); the /app shell
   paints its own palette (dark by default, light only for a light app
   theme), so on /app both theme-color tags take the shell's resolved
   background. `data-surface` lets site.css paint the right ground (and
   boot splash) before Elm renders, so the iOS overscroll band and the
   status/address bar never flash the other scheme. Dependency-free. */
(function () {
  var d = document, root = d.documentElement;
  /* Saved look before first paint: pearl/frost paint light, "system"
     (or nothing saved) follows the device, everything else dark. */
  try {
    var saved = window.localStorage.getItem("onyx:theme");
    if (!saved || /^custom:/.test(saved)) saved = saved ? "custom" : "system";
    if (/^[a-z0-9:_-]{1,40}$/i.test(saved)) root.setAttribute("data-theme", saved === "custom" ? "ocean" : saved);
  } catch (e) {}
  function isApp() { return /^\/app(\/|$)/.test(location.pathname); }
  function sync() {
    var app = isApp();
    root.setAttribute("data-surface", app ? "app" : "site");
    var colour = null;
    if (app) {
      var bg = d.body ? getComputedStyle(d.body).backgroundColor : "";
      colour = bg && bg !== "transparent" && bg !== "rgba(0, 0, 0, 0)" ? bg : "#0e1518";
    }
    var metas = d.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) {
      var next = colour || metas[i].getAttribute("data-site");
      if (next && metas[i].getAttribute("content") !== next) metas[i].setAttribute("content", next);
    }
  }
  ["pushState", "replaceState"].forEach(function (name) {
    var original = history[name];
    if (typeof original !== "function") return;
    history[name] = function () {
      var result = original.apply(this, arguments);
      later();
      return result;
    };
  });
  /* Elm repaints the new route on the next animation frame; read the
     shell's ground after that paint, not before it. */
  function later() {
    try { sync(); } catch (e) {}
    var raf = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
    raf(function () { raf(function () { try { sync(); } catch (e) {} }); });
    setTimeout(function () { try { sync(); } catch (e) {} }, 120);
  }
  window.addEventListener("popstate", later);
  d.addEventListener("DOMContentLoaded", sync);
  try {
    new MutationObserver(function () { if (isApp()) sync(); })
      .observe(root, { attributes: true, attributeFilter: ["data-theme", "style"] });
  } catch (e) {}
  sync();
})();
</script>
<title>Onyx — good company. Great nights.</title>

<link rel="canonical" href="https://eshmaki.me/" />

<meta property="og:url" content="https://eshmaki.me/" />
<meta name="twitter:title" content="Onyx — good company. Great nights." />
<meta name="twitter:description" content="A place for your friends to talk, play, and catch up. Open a room in your browser." />

<body>
<div id="app"></div>
<div id="onyx-private-runtime-presentation" aria-live="polite"></div>
<div id="onyx-private-account-security" aria-live="polite"></div>
<div id="onyx-platform-update-status" aria-live="polite"></div>
<div id="onyx-platform-status" role="status" aria-live="polite"></div>
<noscript><p style="background:#0e1518;color:#e9e5d8;font-family:system-ui,sans-serif;padding:2rem">Onyx needs JavaScript to run. Enable it and reload.</p></noscript>
<script>
/* Boot splash + watchdog. Paints immediately (before the client bundles
   finish downloading) so a slow network never looks like a black screen,
   and converts any boot failure into readable on-screen diagnostics
   instead of an empty dark viewport. Dependency-free by design. */
(function () {
  var app = document.getElementById("app");
  if (!app) return;
  var splash = document.createElement("div");
  splash.id = "onyx-boot-splash";
  splash.setAttribute("style", "background:#0e1518;color:#e9e5d8;font-family:Georgia,serif;min-height:60vh;padding:4rem 1.5rem;max-width:44rem;margin:0 auto");
  splash.innerHTML = "<p style=\"font-size:1.5rem;margin:0 0 0.5rem\">Onyx</p><p id=\"onyx-boot-status\" style=\"font-family:system-ui,sans-serif;color:#9fa9a2;margin:0\">Loading…</p>";
  app.appendChild(splash);
  window.__onyxBootError = null;
  window.addEventListener("error", function (e) {
    if (!e || (e.target && e.target !== window)) return;
    if (!window.__onyxBootError) window.__onyxBootError = e.message || "script error";
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    if (!window.__onyxBootError) {
      var r = e && e.reason;
      window.__onyxBootError = "unhandled: " + ((r && r.message) || r || "rejection");
    }
  });
  window.__onyxShowBootError = function (message) {
    var status = document.getElementById("onyx-boot-status");
    var detail = message || window.__onyxBootError || "still loading — check your connection and reload";
    var info = "";
    try { info = navigator.userAgent + " · " + location.href; } catch (u) {}
    splash.innerHTML = "<p style=\"font-size:1.5rem;margin:0 0 0.5rem\">Onyx could not start</p>"
      + "<p style=\"font-family:ui-monospace,monospace;font-size:0.85rem;color:#e8a33d;overflow-wrap:anywhere\">" + detail.replace(/</g, "&lt;") + "</p>"
      + "<p style=\"font-family:system-ui,sans-serif;color:#9fa9a2;font-size:0.8rem;overflow-wrap:anywhere\">" + String(info).replace(/</g, "&lt;") + "</p>"
      + "<p style=\"font-family:system-ui,sans-serif\"><a style=\"color:#e8a33d\" href=\"\" onclick=\"location.reload();return false\">Reload</a></p>";
    if (status) status.textContent = detail;
  };
  setTimeout(function () {
    if (!window.__onyxBooted) window.__onyxShowBootError(null);
  }, 10000);
})();
</script>
<script src="/app.js"></script>
<script src="/ports.js"></script>
<script src="/runtime.js"></script>
<script>
(async function () {
  try {
  if (!window.OnyxRuntime || typeof window.OnyxRuntime.createBrowserRuntime !== "function"
    || typeof window.OnyxRuntime.createBrowserPlatform !== "function"
    || typeof window.OnyxRuntime.loadBrowserBuildCompatibility !== "function") {
    throw new Error("The private client runtime is unavailable. Restore the runtime bundle and reload before connecting.");
  }
  var shellMeta = document.querySelector('meta[name="onyx-shell-ref"]');
  var indexShellRef = shellMeta && shellMeta.getAttribute("content");
  var buildCompatibility = await window.OnyxRuntime.loadBrowserBuildCompatibility({
    fetch: window.fetch.bind(window), origin: window.location.origin,
    expectedShellRef: typeof indexShellRef === "string" ? indexShellRef : "",
    runtimeShellRef: window.OnyxRuntime.shellRef
  });
  // The browser platform receives the actual private runtime snapshot. The
  // Elm owner-state port intentionally omits the physical socket epoch.
  var runtime = null;
  var browserPlatform = window.OnyxRuntime.createBrowserPlatform({
    serviceWorker: navigator.serviceWorker || null, applicationOrigin: window.location.origin,
    allowedPaths: buildCompatibility ? buildCompatibility.publicNavigationPaths : [],
    getCurrentOwner: function () { return runtime ? runtime.ownerSnapshot() : { networkId: "", accountId: null, accountGeneration: -1, connectionGeneration: -1, physicalRef: null, ownerRef: "" }; },
    isCurrent: function (owner) { return !!runtime && runtime.isCurrent(owner); },
    now: Date.now
  });
  if (!buildCompatibility) {
    var platformStatus = document.getElementById("onyx-platform-status");
    if (platformStatus) platformStatus.textContent = "Background updates and notification routing are unavailable for this shell.";
  }
  var params = new URLSearchParams(window.location.search);
  // Mirror preferences.ts: `onyx:preferences` JSON, `e2eeDms` boolean,
  // default true on missing/unreadable store or non-boolean value.
  var e2eeDms = true;
  try {
    var rawPrefs = window.localStorage.getItem("onyx:preferences");
    if (rawPrefs) {
      var parsedPrefs = JSON.parse(rawPrefs);
      if (parsedPrefs && typeof parsedPrefs.e2eeDms === "boolean") {
        e2eeDms = parsedPrefs.e2eeDms;
      }
    }
  } catch (e) { /* fail open to the default; the fold stays fail-closed */ }
  // Ignore/mute blocklists: `onyx:ignored-users` / `onyx:muted-dms` JSON
  // string arrays. Anything else restores as empty; Elm normalizes
  // fail-closed (trim/lower, 128-char cap, no controls, 512 max).
  function readStringArray(key) {
    try {
      var raw = window.localStorage.getItem(key);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(function (v) { return typeof v === "string"; });
    } catch (e) { return []; }
  }
  var ignoredUsers = readStringArray("onyx:ignored-users");
  var mutedDMs = readStringArray("onyx:muted-dms");
  // Highlight terms (`onyx:highlight-words` JSON string array, plain key
  // like the blocklists; Elm normalizes fail-closed).
  var highlightWords = readStringArray("onyx:highlight-words");
  // Per-room notify levels (`onyx:channel-notify` JSON object
  // `{ [channel]: level }`, plain key like the other prefs; Elm
  // re-validates fail-closed, mirroring oracle `parse`).
  var channelNotify = [];
  try {
    var rawNotify = window.localStorage.getItem("onyx:channel-notify");
    if (rawNotify) {
      var parsedNotify = JSON.parse(rawNotify);
      if (parsedNotify && typeof parsedNotify === "object" && !Array.isArray(parsedNotify)) {
        channelNotify = Object.keys(parsedNotify).map(function (ch) {
          return { channel: ch, level: typeof parsedNotify[ch] === "string" ? parsedNotify[ch] : "" };
        });
      }
    }
  } catch (e) { channelNotify = []; }
  // Room accent labels (`onyx:channel-color-labels` JSON object
  // `{ [channel]: color }`, plain key; Elm re-validates fail-closed,
  // mirroring oracle `parseChannelColors`). Non-string values coerce to
  // "" so one bad entry cannot sink the whole map decode.
  function readColorMap(key) {
    try {
      var raw = window.localStorage.getItem(key);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return [];
      return Object.keys(parsed).map(function (ch) {
        return { channel: ch, color: typeof parsed[ch] === "string" ? parsed[ch] : "" };
      });
    } catch (e) { return []; }
  }
  // Followed conversations (`onyx:followed` JSON string array) and the
  // notification prefs, mirroring the oracle loaders: `onyx:sound`
  // (default true, legacy `onyx:notif-sounds`), `onyx:sound-volume`
  // (default 0.5, sanitized), `onyx:push-notifications` (default true,
  // legacy `onyx:notif-desktop`), `onyx:dnd-enabled`, `onyx:dnd-until`.
  var followed = readStringArray("onyx:followed");
  // Default device-memory search mode (`onyx:vault-search-mode`),
  // mirroring `loadDefaultVaultSearchMode`: unknown reads hybrid.
  var vaultSearchMode = "hybrid";
  try {
    var storedMode = window.localStorage.getItem("onyx:vault-search-mode");
    if (storedMode === "exact" || storedMode === "semantic" || storedMode === "hybrid") {
      vaultSearchMode = storedMode;
    }
  } catch (e) {}
  function readFlagTrue(key, legacy) {
    try {
      var v = window.localStorage.getItem(key);
      if (v !== null) return v !== "false";
      if (legacy) {
        var l = window.localStorage.getItem(legacy);
        if (l === null) return true;
        return key === "onyx:push-notifications" ? l !== "false" : l === "true";
      }
      return true;
    } catch (e) { return true; }
  }
  var pushEnabled = readFlagTrue("onyx:push-notifications", "onyx:notif-desktop");
  var soundEnabled = readFlagTrue("onyx:sound", "onyx:notif-sounds");
  var soundVolume = 0.5;
  try {
    var parsedVol = parseFloat(window.localStorage.getItem("onyx:sound-volume") || "");
    if (isFinite(parsedVol)) soundVolume = Math.max(0, Math.min(1, parsedVol));
  } catch (e) {}
  var dndEnabled = false;
  var dndUntil = null;
  try {
    dndEnabled = window.localStorage.getItem("onyx:dnd-enabled") === "true";
    var parsedUntil = Number(window.localStorage.getItem("onyx:dnd-until"));
    if (isFinite(parsedUntil) && parsedUntil > Date.now()) dndUntil = Math.floor(parsedUntil);
  } catch (e) {}
  var dndQuietStart = 22;
  var dndQuietEnd = 8;
  var firstHourSeen = false;
  try {
    var parsedQuietStart = Number(window.localStorage.getItem("onyx:dnd-quiet-start"));
    var parsedQuietEnd = Number(window.localStorage.getItem("onyx:dnd-quiet-end"));
    if (Number.isInteger(parsedQuietStart) && parsedQuietStart >= 0 && parsedQuietStart <= 23) dndQuietStart = parsedQuietStart;
    if (Number.isInteger(parsedQuietEnd) && parsedQuietEnd >= 0 && parsedQuietEnd <= 23) dndQuietEnd = parsedQuietEnd;
    firstHourSeen = window.localStorage.getItem("onyx:first-hour-seen") === "1";
  } catch (e) {}
  var defaultWsUrl = "wss://eshmaki.me:8080";
  var initialWsUrl = params.get("ws") || defaultWsUrl;
  var app = Elm.Main.init({
    node: document.getElementById("app"),
    flags: {
      wsUrl: initialWsUrl,
      wsPin: params.get("ws"),
      mediaUrl: null,
      // A missing ?nick= arms the connect gate; Elm still dials as "guest".
      nick: params.get("nick"),
      origin: window.location.origin,
      nowMs: Date.now(),
      e2eeDms: e2eeDms,
      ignoredUsers: ignoredUsers,
      mutedDMs: mutedDMs,
      followed: followed,
      highlightWords: highlightWords,
      channelNotify: channelNotify,
      starredChannels: readStringArray("onyx:starred-channels"),
      forumChannels: readStringArray("onyx:forum-channels"),
      autoJoinChannels: readStringArray("onyx:autojoin-channels"),
      channelColors: readColorMap("onyx:channel-color-labels"),
      scheduledMessages: (function () {
        try { return window.localStorage.getItem("onyx:scheduled"); }
        catch (e) { return null; }
      })(),
      vaultSearchMode: vaultSearchMode,
      pushEnabled: pushEnabled,
      soundEnabled: soundEnabled,
      soundVolume: soundVolume,
      dndEnabled: dndEnabled,
      dndUntil: dndUntil,
      dndQuietStart: dndQuietStart,
      dndQuietEnd: dndQuietEnd,
      firstHourSeen: firstHourSeen,
    }
  });
  var endpointId = "custom";
  var networkId = "custom-endpoint";
  try {
    var normalizedWs = new URL(initialWsUrl);
    if (normalizedWs.protocol !== "wss:" || normalizedWs.username || normalizedWs.password
      || normalizedWs.search || normalizedWs.hash || /[\u0000-\u0020\u007f]/u.test(initialWsUrl)) {
      throw new Error("The configured WebSocket endpoint is not a supported secure endpoint.");
    }
    var known = { [new URL(defaultWsUrl).href]: ["onyx-main", "a"], "wss://eshmaki.me:8080/": ["onyx-main", "b"] };
    var trusted = known[normalizedWs.href];
    if (trusted) { networkId = trusted[0]; endpointId = trusted[1]; }
    else {
      var customScope = "custom:" + normalizedWs.origin + normalizedWs.pathname;
      endpointId = customScope;
      networkId = customScope;
    }
  } catch (badUrl) { throw new Error("The configured WebSocket endpoint is invalid."); }
  var runtimeConfig = {
    networkId: networkId,
    endpointId: endpointId,
    trustedEndpoints: ["a", "b"],
    endpointRegistry: [
      { url: defaultWsUrl, networkId: "onyx-main", endpointId: "a" },
      { url: "wss://eshmaki.me:8080", networkId: "onyx-main", endpointId: "b" }
    ],
    initialUrl: initialWsUrl,
    buildCompatibility: buildCompatibility || undefined,
    browserPlatform: browserPlatform,
    onLines: function (lines, at) { app.ports.wsLines.send({ at: at, lines: lines }); },
    onCredentialState: function (state) { app.ports.runtimeCredentialState.send({ credentials: state.credentials, issuance: state.issuance, remembered: state.remembered }); },
    onOwnerState: function (state) {
      app.ports.runtimeOwnerState.send(state);
    },
    onPrivateWebhookResult: function (event) { app.ports.runtimePrivateWebhookResult.send(event); },
    onNotificationNavigation: function (event) {
      if (app.ports.runtimeNotificationNavigation) app.ports.runtimeNotificationNavigation.send(event);
    },
    onFeatureReadiness: function (state) { app.ports.runtimeFeatureReadiness.send(state); },
    onCapabilityResolution: function (state) { app.ports.runtimeCapabilityResolution.send(state); },
    onConnectionState: function (state, url) {
      if (state === "live") app.ports.wsOpened.send({ url: url });
      else if (state === "offline") app.ports.wsClosed.send({ clean: false, reason: "connection closed" });
    }
  };
  if (app.ports.wsFrames && typeof app.ports.wsFrames.send === "function") {
    runtimeConfig.onFrames = function (batch) { app.ports.wsFrames.send(batch); };
  }
  runtime = window.OnyxRuntime.createBrowserRuntime(runtimeConfig);
  if (!OnyxPorts.wire(app, { runtime: runtime, requirePrivateRuntime: true })) {
    throw new Error("The private client runtime is unavailable. Restore the runtime bundle and reload before connecting.");
  }
  window.__onyxBooted = true;
  var splash = document.getElementById("onyx-boot-splash");
  if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
  } catch (err) {
    var message = (err && err.message) || String(err);
    if (window.__onyxShowBootError) window.__onyxShowBootError(message);
    throw err;
  }
})();
</script>
